# Label strings as they appear on real labels and retailer pages, and the
# canonical entry each must resolve to. Curated from the research agents'
# tables (seed/research/<slug>.md): pairs are checked before they land
# here. Keyed by ISO country; region lookups pass that country.
#
# `not_grapes` lists strings that must NOT resolve as grapes, because they
# would mislead the tagger or evidence.py (a place name that was once a grape
# synonym).

