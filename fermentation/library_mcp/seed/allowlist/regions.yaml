# Canonical wine-region allowlist. Hierarchy, country and classification are
# authored HERE (Wikidata's P131 is administrative, not viticultural, and
# its typing of wine regions is inconsistent). `parent` names another entry
# in this file, in the same country. `synonyms` feed region_synonyms.
# QIDs are best-effort via qids.lock.yaml; a region without one is fine.
#
# Conventions:
#   * Names are the retail-facing English form (Piedmont, Burgundy, Tuscany).
#   * A synonym may not equal any other region's name or synonym (validator).
#   * High-volume IGP/IGT/regional designations are included on purpose
#     (Pays d'Oc, Vin de France, Toscana IGT, delle Venezie, South Eastern
#     Australia) -- they are what the label says.
#   * Every allowlisted country gets at least its top 1-3 regions
#     ("single-region floor") so "country known, region placeholder" is rare.

