# Canonical wine-producing countries (OIV-aligned, plus minor producers the
# shop actually stocks). Keyed by ISO-3166-1 alpha-2; the QID is resolved at
# build time from the ISO code (wdt:P297), so no lock entry is needed.
# `synonyms` are appended to Wikidata's altLabels (USA, U.S., ...).
- {name: "France", iso: FR}
- {name: "Italy", iso: IT, synonyms: ["Italia"]}
- {name: "Spain", iso: ES, synonyms: ["España", "Espana"]}
- {name: "Portugal", iso: PT}
- {name: "Germany", iso: DE, synonyms: ["Deutschland"]}
- {name: "Austria", iso: AT, synonyms: ["Österreich", "Osterreich"]}
- {name: "Switzerland", iso: CH, synonyms: ["Suisse", "Schweiz", "Svizzera"]}
- {name: "Luxembourg", iso: LU}
- {name: "United Kingdom", iso: GB, synonyms: ["UK", "U.K.", "Great Britain", "Britain", "England"]}
- {name: "Greece", iso: GR, synonyms: ["Hellas"]}
- {name: "Cyprus", iso: CY}
- {name: "Hungary", iso: HU, synonyms: ["Magyarország", "Magyarorszag"]}
- {name: "Czechia", iso: CZ, synonyms: ["Czech Republic"]}
- {name: "Slovakia", iso: SK}
- {name: "Romania", iso: RO, synonyms: ["România"]}
- {name: "Bulgaria", iso: BG}
- {name: "Croatia", iso: HR, synonyms: ["Hrvatska"]}
- {name: "Slovenia", iso: SI, synonyms: ["Slovenija"]}
