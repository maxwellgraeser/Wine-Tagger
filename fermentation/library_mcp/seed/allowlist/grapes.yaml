# Canonical grape allowlist. `name` is the display/canonical spelling the MCP
# returns; `color` is authored here because Wikidata has P462 on only 2 of
# ~2,400 grape-variety items; `synonyms` are merged with Wikidata altLabels.
# QIDs come from qids.lock.yaml (seed/resolve_qids.py) unless pinned here.
#
# Rules: a synonym may not equal another entry's name, and a synonym may
# belong to only one entry (validator enforces). Keep the list to grapes
# that appear on commercial labels; the placeholder pass covers the rest.

