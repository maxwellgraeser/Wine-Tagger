# --- Región de Aconcagua ---
# Naming collision: the existing "Aconcagua" region entry carried "Aconcagua Valley" /
# "Valle de Aconcagua" as synonyms, but the decree's Subregión Valle del Aconcagua (the
# Panquehue/San Felipe/Los Andes/Quillota area, excluding Casablanca and San Antonio) is
# a narrower, separate unit that the trade also calls "Aconcagua Valley" (e.g. Errázuriz's
# Aconcagua Valley wines). Kept region name "Aconcagua" but dropped the valley-specific
# synonyms from it, and gave the subregion its own entry below. See cl.md.
- {name: "Aconcagua", country: CL, synonyms: ["Aconcagua Region", "Región de Aconcagua", "Región Vitícola de Aconcagua"], source: "https://www.sag.gob.cl/sites/default/files/decreto_ndeg_464.pdf"}
